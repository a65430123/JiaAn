<section class="ja-flow"><div class="hd"><span class="orn" aria-hidden="true"><i></i><b></b><i></i></span><h2>施工流程</h2><p>每一步都先跟您說清楚，確認了才動工。</p></div><ol><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.4 9.4 0 0 1-3.6-.7L3 21l1.6-4.4A7.9 7.9 0 0 1 3 11.5C3 6.8 7 3 12 3s9 3.8 9 8.5z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg></span><div class="tx"><span class="no">第 1 步</span><h3>諮詢</h3><p class="ds">打電話或 LINE 說明需求，拍照傳來更快。</p></div></li><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span><div class="tx"><span class="no">第 2 步</span><h3>勘查</h3><p class="ds">約好時間到府查看、丈量，找出問題原因。</p></div></li><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg></span><div class="tx"><span class="no">第 3 步</span><h3>報價</h3><p class="ds">提供明細報價單，材料、工資清楚列出。</p></div></li><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></svg></span><div class="tx"><span class="no">第 4 步</span><h3>施工</h3><p class="ds">依約定時間施工，做好保護與安全措施。</p></div></li><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span><div class="tx"><span class="no">第 5 步</span><h3>驗收</h3><p class="ds">完工後陪您逐項檢查，確認沒問題才算完成。</p></div></li><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span><div class="tx"><span class="no">第 6 步</span><h3>保固</h3><p class="ds">提供保固與售後，有狀況隨時找我們。</p></div></li></ol></section>
<script>(function(){var r=document.currentScript.previousElementSibling;while(r&&r.tagName!=="SECTION")r=r.previousElementSibling;if(!r||!("IntersectionObserver" in window)||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))return;var e=r.querySelectorAll(".hd,li");for(var i=0;i<e.length;i++){e[i].setAttribute("data-rv","");e[i].style.setProperty("--i",Math.min(i,8))}r.classList.add("rv");var io=new IntersectionObserver(function(x){if(x[0].isIntersecting){r.classList.add("in");io.disconnect();setTimeout(function(){r.classList.remove("rv","in")},2200)}},{threshold:.1});io.observe(r)})();</script>

<!--
  家安工程行｜施工流程時間軸
  用途：讓客人知道從聯絡到保固每一步會發生什麼事，減少不安。桌機橫向、手機直向。
  放置位置：「服務項目」頁服務卡片下方；首頁也可放在評價前。
  建議嵌入高度：桌機約 340px／手機約 580px
  貼法：協作平台 → 插入 → 嵌入 → 嵌入程式碼 → 貼上 → 插入，再拖曳框線調整高度
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:transparent}.ja-flow{--navy:#1F3A5F;--orange:#F28C28;--orange-t:#B45F12;--warm:#FAF8F5;--ink:#2B2B2B;--muted:#5B6470;--line:#E7E1D8;--soft:#EAF0F6;--btn-ink:#1B2A3E;--shadow:0 6px 20px rgba(31,58,95,.08),0 1px 3px rgba(31,58,95,.06);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:transparent;width:100%;margin:0;padding:22px 6px;line-height:1.65;font-size:17px;-webkit-font-smoothing:antialiased;box-sizing:border-box}.ja-flow *,.ja-flow *::before,.ja-flow *::after{box-sizing:border-box}.ja-flow h2,.ja-flow h3,.ja-flow p,.ja-flow ul,.ja-flow ol{margin:0}.ja-flow .hd{margin-bottom:22px;max-width:680px}.ja-flow .hd h2{font-size:30px;font-weight:700;color:var(--navy);line-height:1.35;letter-spacing:.02em;text-wrap:balance}.ja-flow .hd p{margin-top:8px;color:var(--muted);font-size:17px}.ja-flow .ic{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.ja-flow a:focus-visible,.ja-flow button:focus-visible,.ja-flow summary:focus-visible,.ja-flow [tabindex]:focus-visible{outline:3px solid var(--orange);outline-offset:2px}.ja-flow .swipe{display:none;font-size:13px;color:var(--muted);text-align:center;margin-top:4px}@media (max-width:600px){.ja-flow{padding:16px 4px;font-size:16px}.ja-flow .hd{margin-bottom:16px}.ja-flow .hd h2{font-size:24px}.ja-flow .hd p{font-size:16px}}@media (prefers-reduced-motion:reduce){.ja-flow *{transition:none!important;animation:none!important;scroll-behavior:auto!important}}.ja-flow ol{list-style:none;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.ja-flow li{position:relative;text-align:center;min-width:0}.ja-flow .dot{width:60px;height:60px;border-radius:50%;background:#fff;border:2px solid var(--navy);color:var(--navy);display:grid;place-items:center;margin:0 auto 12px;position:relative;z-index:1}.ja-flow li:last-child .dot{border-color:var(--orange);background:#FDEBD6;color:var(--orange-t)}.ja-flow li:not(:last-child)::after{content:"";position:absolute;top:30px;left:calc(50% + 38px);right:calc(-50% + 26px);height:2px;background:repeating-linear-gradient(90deg,rgba(31,58,95,.45) 0 6px,transparent 6px 11px)}.ja-flow .no{display:block;font-size:13px;font-weight:700;color:var(--orange-t);letter-spacing:.08em}.ja-flow h3{font-size:19px;color:var(--navy);margin:2px 0 4px}.ja-flow p.ds{font-size:14.5px;color:var(--muted);line-height:1.6;padding:0 4px}@media (max-width:760px){.ja-flow ol{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.ja-flow li{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:40px 1fr;gap:4px 10px;align-items:center}.ja-flow li:not(:last-child)::after{display:none}.ja-flow .dot{width:40px;height:40px;margin:0;border-width:1.5px}.ja-flow .dot .ic{width:21px;height:21px}.ja-flow .tx{display:contents}.ja-flow .no{grid-column:2;grid-row:1;align-self:end;font-size:12px}.ja-flow h3{grid-column:2;grid-row:2;align-self:start;font-size:17px;margin:-4px 0 0}.ja-flow p.ds{grid-column:1/-1;padding:4px 0 0;font-size:14px;line-height:1.55}}@media (max-width:600px){.ja-flow ol{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ja-flow li{padding:10px}}</style>
<section class="ja-flow"><div class="hd"><h2>施工流程</h2><p>每一步都先跟您說清楚，確認了才動工。</p></div><ol><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.4 9.4 0 0 1-3.6-.7L3 21l1.6-4.4A7.9 7.9 0 0 1 3 11.5C3 6.8 7 3 12 3s9 3.8 9 8.5z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg></span><div class="tx"><span class="no">第 1 步</span><h3>諮詢</h3><p class="ds">打電話或 LINE 說明需求，拍照傳來更快。</p></div></li><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span><div class="tx"><span class="no">第 2 步</span><h3>勘查</h3><p class="ds">約好時間到府查看、丈量，找出問題原因。</p></div></li><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg></span><div class="tx"><span class="no">第 3 步</span><h3>報價</h3><p class="ds">提供明細報價單，材料、工資清楚列出。</p></div></li><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></svg></span><div class="tx"><span class="no">第 4 步</span><h3>施工</h3><p class="ds">依約定時間施工，做好保護與安全措施。</p></div></li><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span><div class="tx"><span class="no">第 5 步</span><h3>驗收</h3><p class="ds">完工後陪您逐項檢查，確認沒問題才算完成。</p></div></li><li><span class="dot"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span><div class="tx"><span class="no">第 6 步</span><h3>保固</h3><p class="ds">提供保固與售後，有狀況隨時找我們。</p></div></li></ol></section>

<section class="ja-why dk"><div class="hd"><span class="orn" aria-hidden="true"><i></i><b></b><i></i></span><h2>為什麼選擇家安？</h2><p>我們把每個家都當成自己家在做。</p></div><div class="row"><div class="it"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg></span><h3>一條龍統包</h3><p class="ds">水電、泥作、木作、油漆一次包辦，不用自己找好幾組師傅，溝通一次就好。</p></div><div class="it"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg></span><h3>透明報價</h3><p class="ds">到府看過再報價，材料、工錢一項一項寫清楚，說好的價格不會再追加。</p></div><div class="it"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><h3>準時完工</h3><p class="ds">開工前排好工期，施工中隨時回報進度，完工清潔乾淨再交屋。</p></div><div class="it"><span class="ico"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span><h3>保固售後</h3><p class="ds">完工提供保固，有問題打一通電話，師傅回來處理。</p></div></div></section>

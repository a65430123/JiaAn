<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>家安工程行 區塊編輯器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: 左側區塊清單｜中間內容表單｜右側即時預覽（桌機 1000px／手機 360px），窄螢幕改為上下堆疊 */
:root{
  --bg:#F1EEE9;--panel:#FFFFFF;--panel-2:#F8F6F2;--ink:#24282D;--muted:#626A74;--line:#E0D9CF;
  --accent:#1F3A5F;--accent-soft:#E6ECF4;--accent-ink:#FFFFFF;--orange:#F28C28;--orange-ink:#1B2A3E;
  --warn-bg:#FFF2E0;--warn:#8A4F0C;--ok:#2D7148;--danger:#B3261E;--stage:#E4DFD7;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 6px 18px rgba(20,30,45,.06);
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151B;--panel:#1A2029;--panel-2:#212834;--ink:#E9E5DE;--muted:#9BA4AF;--line:#2E3845;
  --accent:#93B5E2;--accent-soft:#233247;--accent-ink:#0E1620;--orange:#F39A42;--orange-ink:#1B1206;
  --warn-bg:#3A2A14;--warn:#F3C27E;--ok:#82CFA0;--danger:#FF8A80;--stage:#0C1015;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B;--panel:#1A2029;--panel-2:#212834;--ink:#E9E5DE;--muted:#9BA4AF;--line:#2E3845;
  --accent:#93B5E2;--accent-soft:#233247;--accent-ink:#0E1620;--orange:#F39A42;--orange-ink:#1B1206;
  --warn-bg:#3A2A14;--warn:#F3C27E;--ok:#82CFA0;--danger:#FF8A80;--stage:#0C1015;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line);background:var(--panel)}
.mark{width:38px;height:38px;border-radius:10px;background:#1F3A5F;display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px;stroke:#F28C28;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.top .sub{font-size:13px;color:var(--muted)}
.status{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding-block:20px;align-items:start}
.nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:4px}
.nav h2{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:14px 10px 4px;font-weight:700}
.nav h2:first-child{margin-top:0}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink)}
.nav button:hover{background:var(--panel)}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.nav .n{font-size:12px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.nav button[aria-current="true"] .n{background:rgba(255,255,255,.18);color:inherit}
.nav .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--orange)}

.work{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:20px;align-items:start;min-width:0}
.work.full{grid-template-columns:minmax(0,1fr)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.pane-h{padding:16px 18px;border-bottom:1px solid var(--line)}
.pane-h h2{margin:0;font-size:19px}
.pane-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin-top:10px}
.meta dt{color:var(--muted)}
.meta dd{margin:0}
.meta b{font-variant-numeric:tabular-nums}
.note{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--ink)}

.f{display:flex;flex-direction:column;gap:5px}
.f>label,.f>.lbl{font-size:13.5px;font-weight:700}
.f .h{font-size:12.5px;color:var(--muted)}
.f input[type=text],.f input[type=url],.f input[type=number],.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 10px;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:#1F3A5F}
.iconpick{display:flex;gap:8px;align-items:center}
.iconpick .sw{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.iconpick svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.item>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;font-weight:700;font-size:14px}
.item>summary::-webkit-details-marker{display:none}
.item>summary .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item>summary .chev{transition:transform .2s;color:var(--muted)}
.item[open]>summary .chev{transform:rotate(90deg)}
.item .body{padding:4px 12px 12px;display:flex;flex-direction:column;gap:12px}
.tools{display:flex;gap:4px}
.tb{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 7px;font-size:12.5px;cursor:pointer;line-height:1.5}
.tb:hover{border-color:var(--accent)}
.tb.del.arm{background:var(--danger);color:#fff;border-color:var(--danger)}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:10px;padding:9px;cursor:pointer;font-weight:700;color:var(--accent)}
.add:hover{border-color:var(--accent);background:var(--accent-soft)}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.navy{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.pv{position:sticky;top:12px}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.hgt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hgt b{color:var(--ink)}
.pv-bar .sp{flex:1}
.stage{background:var(--stage);padding:18px;border-radius:0 0 12px 12px;overflow:hidden;position:relative}
.site{background:#FAF8F5;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:6px;overflow:hidden;transform-origin:top left;position:relative}
.site iframe{display:block;border:0;width:100%}
.site .ruler{position:absolute;left:0;right:0;height:0;border-top:2px dashed #F28C28;pointer-events:none}
.site .ruler span{position:absolute;right:6px;top:-22px;font-size:11px;background:#F28C28;color:#1B2A3E;padding:1px 6px;border-radius:4px;font-family:var(--f)}
.offscreen{position:absolute;left:-20000px;top:0;visibility:hidden}
.codebox{width:100%;min-height:220px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:10px;white-space:pre;overflow:auto}
.toast{font-size:13px;color:var(--ok);font-weight:700}

.guide{max-width:880px}
.guide h2{font-size:22px;margin:28px 0 8px;color:var(--accent)}
.guide h2:first-child{margin-top:0}
.guide h3{font-size:17px;margin:18px 0 6px}
.guide p,.guide li{max-width:68ch}
.guide ol,.guide ul{padding-left:22px;margin:6px 0}
.guide li{margin:3px 0}
.guide .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0}
.guide table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
.guide th,.guide td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.guide th{background:var(--panel-2);font-size:13px}
.guide tr:last-child td{border-bottom:0}
.guide code{font-family:var(--mono);font-size:13px;background:var(--panel-2);padding:1px 5px;border-radius:4px;word-break:break-all}
.pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:10px 0}
.pg{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel-2)}
.pg h3{margin:0 0 6px;font-size:16px}
.pg ol{margin:0;padding-left:20px;font-size:14px}
.pg .nat{color:var(--muted)}
.pg .emb{font-weight:700}

@media (max-width:1180px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav h2{display:none}
  .nav button{width:auto;white-space:nowrap;background:var(--panel);border:1px solid var(--line)}
}
@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr)}
  .pv{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top wrap">
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="m9 14 2 2 4-4"/></svg></div>
  <div>
    <h1>家安工程行｜網站區塊編輯器</h1>
    <div class="sub">改文字、增減項目，右邊立即預覽；完成後按「複製嵌入程式碼」貼到 Google 協作平台。</div>
  </div>
  <div class="status" id="status"><i></i><span>已自動儲存在這台電腦的瀏覽器</span></div>
</header>

<div class="app wrap">
  <nav class="nav" id="nav" aria-label="區塊清單"></nav>
  <main class="work" id="work">
    <section class="pane" id="editorPane"></section>
    <section class="pane pv" id="previewPane">
      <div class="pv-bar">
        <div class="seg" role="group" aria-label="預覽裝置">
          <button type="button" id="devD" aria-pressed="true">桌機 1000px</button>
          <button type="button" id="devM" aria-pressed="false">手機 360px</button>
        </div>
        <span class="hgt" id="hgt">測量中…</span>
        <span class="sp"></span>
        <button type="button" class="btn" id="showCode">查看程式碼</button>
        <button type="button" class="btn primary" id="copyCode">複製嵌入程式碼</button>
      </div>
      <div class="stage" id="stage">
        <div class="site" id="siteD"><iframe id="frD" title="桌機預覽"></iframe></div>
        <div class="site" id="siteM" hidden><iframe id="frM" title="手機預覽"></iframe></div>
      </div>
      <div class="pane-b" id="codeWrap" hidden>
        <div class="toast" id="toast" aria-live="polite"></div>
        <textarea class="codebox" id="codeBox" readonly spellcheck="false" aria-label="嵌入程式碼"></textarea>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
'use strict';
var SO='<scr'+'ipt>', SC='</scr'+'ipt>';

/* ---------------- 圖示（線條風格，24×24） ---------------- */
var ICONS={
  water:['水電','<path d="M8 21a5 5 0 0 0 5-5c0-3-5-9-5-9s-5 6-5 9a5 5 0 0 0 5 5z"/><path d="M17.5 2 15 8h4l-2.5 6"/>'],
  bolt:['電力','<path d="M13 2 4 14h8l-1 8 9-12h-8l1-8z"/>'],
  plug:['插頭','<path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0z"/><path d="M12 17v5"/>'],
  wifi:['網路弱電','<path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M2 9a15 15 0 0 1 20 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/>'],
  cctv:['監視器','<rect x="2" y="5" width="14" height="8" rx="2"/><path d="m16 8 5-2v6l-5-2"/><path d="M7 13v4H3M7 17v3"/>'],
  sofa:['室內裝潢','<path d="M20 9V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v2"/><path d="M2 11v5a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v2H6v-2a2 2 0 0 0-4 0z"/><path d="M5 18v2M19 18v2"/>'],
  roller:['油漆','<rect x="3" y="3" width="14" height="6" rx="1.5"/><path d="M17 6h3a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-8v3"/><rect x="10" y="14" width="4" height="7" rx="1"/>'],
  brick:['泥作','<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.3h18M3 14.7h18M9 4v5.3M15 9.3v5.4M9 14.7V20"/>'],

  chat:['諮詢','<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.4 9.4 0 0 1-3.6-.7L3 21l1.6-4.4A7.9 7.9 0 0 1 3 11.5C3 6.8 7 3 12 3s9 3.8 9 8.5z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/>'],
  search:['勘查','<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>'],
  ruler:['丈量','<path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0z"/><path d="m14.5 12.5 2-2M11.5 9.5l2-2M8.5 6.5l2-2M17.5 15.5l2-2"/>'],
  wrench:['施工','<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>'],
  check:['驗收','<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'],
  calendar:['年資','<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'],
  home:['住家','<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>'],
  thumb:['好評','<path d="M7 10v11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="m7 10 4-8a3 3 0 0 1 3 3v4h5.5a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 18.1 21H7"/>'],

  phone:['電話','<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>'],
  form:['表單','<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>'],
  arrow:['箭頭','<path d="M5 12h14M13 6l6 6-6 6"/>'],
  pin:['地點','<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>']
};
function svg(k,cls){var i=ICONS[k]||ICONS.home;return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" aria-hidden="true">'+i[1]+'</svg>';}
var ICON_OPTS=Object.keys(ICONS).map(function(k){return [k,ICONS[k][0]];});
var STAR='<path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/>';

/* ---------------- 工具函式 ---------------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nl(s){return esc(s).replace(/\n/g,'<br>');}
function fmtPhone(p){var d=String(p||'').replace(/\D/g,'');if(/^09\d{8}$/.test(d))return d.slice(0,4)+'-'+d.slice(4,7)+'-'+d.slice(7);if(/^0\d{8,9}$/.test(d))return d.slice(0,d.length-8)+'-'+d.slice(-8,-4)+'-'+d.slice(-4);return p||'';}
function telHref(p){return 'tel:'+String(p||'').replace(/[^\d+]/g,'');}
function splitList(s){return String(s||'').split(/[、,，\n]/).map(function(x){return x.trim();}).filter(Boolean);}
function A(href,cls,inner,label){return '<a class="'+cls+'" href="'+esc(href||'#')+'" target="_blank" rel="noopener"'+(label?' aria-label="'+esc(label)+'"':'')+'>'+inner+'</a>';}
function ph(w,h,bg,fg,icon,label,hint,k){k=k||1;

var KEY='jiaan-blocks-v1';
var state=defaults();
function merge(def,v){if(Array.isArray(def))return Array.isArray(v)?v:def;if(def&&typeof def==='object'){var o={};Object.keys(def).forEach(function(k){o[k]=(v&&k in v)?merge(def[k],v[k]):def[k];});return o;}return v===undefined?def:v;}
try{var raw=localStorage.getItem(KEY);if(raw)state=merge(defaults(),JSON.parse(raw));}catch(e){}
var stEl=document.getElementById('status');
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(state));stEl.innerHTML='<i></i><span>已自動儲存在這台電腦的瀏覽器</span>';}catch(e){stEl.innerHTML='<i style="background:var(--orange)"></i><span>瀏覽器無法自動儲存，請用「備份與還原」保存</span>';}},400);}

var measures={};
function blockDef(id){for(var i=0;i<BLOCKS.length;i++)if(BLOCKS[i].id===id)return BLOCKS[i];}
function rec(h){return h?Math.ceil((h+16)/10)*10:0;}
function buildCode(id,withComment){
  var def=blockDef(id),parts=GEN[id](state.blocks[id],state.brand),m=measures[id]||{};
  var c='';
  if(withComment){
    c+='<!--\n  '+state.brand.name+'｜'+def.name+'\n  用途：'+def.use+'\n  放置位置：'+def.place+'\n'+
    '  建議嵌入高度：桌機約 '+(rec(m.d)||'—')+'px／手機約 '+(rec(m.m)||'—')+'px\n'+
    '  貼法：協作平台 → 插入 → 嵌入 → 嵌入程式碼 → 貼上 → 插入，再拖曳框線調整高度\n-->\n';
  }
  var cls=parts[0].match(/\.(ja-[a-z]+)\{/)[1],dk=state.blocks[id].bg==='navy';
  c+=FONT+'\n<style>'+parts[0]+luxBase(cls,dk)+LUX[id]('.'+cls,dk)+'</style>\n<section class="'+cls+(dk?' dk':'')+'">'+parts[1]+'</section>'+(parts[2]?'\n'+SO+parts[2]+SC:'')+'\n'+SO+revealJS(id)+SC+'\n';
  return c;
}
window.JIAAN={buildCode:buildCode,blocks:BLOCKS.map(function(b){return b.id;}),measures:measures,state:function(){return state;}};

/* 表單產生 */
function uid(){return 'f'+Math.random().toString(36).slice(2,9);}
function buildFields(parent,fields,obj,onInput,onStruct){
  fields.forEach(function(f){
    if(f.row){var r=document.createElement('div');r.className='two';parent.appendChild(r);buildFields(r,f.row,obj,onInput,onStruct);return;}
    var w=document.createElement('div');w.className='f';var id=uid();
    if(f.t==='list'){renderList(w,f,obj,onInput,onStruct);parent.appendChild(w);return;}
    if(f.t==='check'){
      w.innerHTML='<label class="chk"><input type="checkbox" id="'+id+'"'+(obj[f.k]?' checked':'')+'> '+esc(f.l)+'</label>';
      w.querySelector('input').onchange=function(e){obj[f.k]=e.target.checked;onInput();};
      parent.appendChild(w);return;
    }
    var lab='<label for="'+id+'">'+esc(f.l)+'</label>',ctl;
    if(f.t==='textarea')ctl='<textarea id="'+id+'" rows="3">'+esc(obj[f.k])+'</textarea>';
    else if(f.t==='select')ctl='<select id="'+id+'">'+f.o.map(function(o){return '<option value="'+o[0]+'"'+(String(obj[f.k])===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';
    else if(f.t==='icon')ctl='<div class="iconpick"><span class="sw">'+svg(obj[f.k])+'</span><select id="'+id+'">'+ICON_OPTS.map(function(o){return '<option value="'+o[0]+'"'+(obj[f.k]===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select></div>';
    else ctl='<input id="'+id+'" type="'+(f.t==='number'?'number':f.t==='url'?'url':'text')+'" value="'+esc(obj[f.k])+'"'+(f.t==='url'?' placeholder="https://"':'')+'>';
    w.innerHTML=lab+ctl+(f.h?'<span class="h">'+esc(f.h)+'</span>':'');
    var el=w.querySelector('#'+id);
    var ev=(f.t==='select'||f.t==='icon')?'change':'input';
    el.addEventListener(ev,function(){
      var v=el.value;if(f.t==='number')v=v===''?0:Number(v);if(f.k==='stars')v=Number(v);
      obj[f.k]=v;
      if(f.t==='icon')w.querySelector('.sw').innerHTML=svg(v);
      if(f.lab)f.lab();
      onInput();
      var sm=w.closest('.item');if(sm&&sm._upd)sm._upd();
    });
    parent.appendChild(w);
  });
}
var openItems={};
function renderList(w,f,obj,onInput,onStruct){
  var arr=obj[f.k];
  w.innerHTML='<span class="lbl">'+esc(f.l)+'（'+arr.length+'）</span>';
  var ls=document.createElement('div');ls.className='list';w.appendChild(ls);
  arr.forEach(function(it,i){
    var d=document.createElement('details');d.className='item';
    var key=current+'.'+f.k+'.'+i;if(openItems[key])d.open=true;
    d.addEventListener('toggle',function(){openItems[key]=d.open;});
    d.innerHTML='<summary><span class="chev">›</span><span class="t"></span><span class="tools">'+
      '<button type="button" class="tb" data-a="up" aria-label="上移"'+(i===0?' disabled':'')+'>↑</button>'+
      '<button type="button" class="tb" data-a="down" aria-label="下移"'+(i===arr.length-1?' disabled':'')+'>↓</button>'+
      '<button type="button" class="tb" data-a="dup">複製</button>'+
      '<button type="button" class="tb del" data-a="del">刪除</button></span></summary><div class="body"></div>';
    var t=d.querySelector('.t');d._upd=function(){t.textContent=(i+1)+'. '+(f.lab?f.lab(it,i):'項目');};d._upd();
    d.querySelectorAll('.tb').forEach(function(b){b.addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();var a=b.getAttribute('data-a');
      if(a==='del'){
        if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='確定刪除？';setTimeout(function(){b.classList.remove('arm');b.textContent='刪除';},3000);return;}
        arr.splice(i,1);
      }else if(a==='up'&&i>0){arr.splice(i-1,0,arr.splice(i,1)[0]);}

      else if(a==='dup'){arr.splice(i+1,0,JSON.parse(JSON.stringify(it)));}
      openItems={};onStruct();
    });});
    buildFields(d.querySelector('.body'),f.f,it,onInput,onStruct);
    ls.appendChild(d);
  });
  var add=document.createElement('button');add.type='button';add.className='add';add.textContent='＋ 新增'+f.name;
  add.onclick=function(){arr.push(JSON.parse(JSON.stringify(f.add)));openItems={};openItems[current+'.'+f.k+'.'+(arr.length-1)]=true;onStruct();};

}

function fit(){
  var avail=stage.clientWidth-36;
  [[siteD,frD,1000,'d'],[siteM,frM,360,'m']].forEach(function(x){
    var site=x[0],fr=x[1],W=x[2],m=measures[previewId]||{},h=m[x[3]]||300;
